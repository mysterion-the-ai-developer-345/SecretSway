# SecretSway -- a terminal-styled launcher
#
# Every key below is optional; delete anything you do not want to change.
# Unrecognised keys are an error, not a silent no-op, so a typo shows up
# immediately instead of as a subtle rendering difference.

[colors]
panel  = "#1e1e1e"   # dark grey body of the strip
border = "#2f6bff"   # electric cobalt outline
text   = "#d6d6d6"   # light grey body text
dim    = "#6b6b6b"   # exec column, prompt prefix, status hints
cursor = "#2f6bff"   # block cursor and fuzzy-match highlight
sel_bg = "#d6d6d6"   # the selection is an inverted bar, terminal-style
sel_fg = "#1e1e1e"

[ui]
font           = "JetBrains Mono, DejaVu Sans Mono, monospace"
font_size      = 14
max_rows       = 15      # result list is capped here; the strip grows below it
border_width   = 1
pad_x          = 2       # inner margin, in character cells
top_margin     = 0
cursor_blink_ms = 530
wrap           = false   # false: stop at the ends.  true: cycle like fuzzel
right_column   = "off"   # "off" (name only) | "dots" (usage frequency) | "exec" (raw command)
show_generic   = false   # swap the exec column for GenericName
show_index     = true    # the right-aligned 1/2/3 gutter

[behaviour]
# How a query that matches no application is run.
#   "shell" -- sh -c, so pipes and redirects work.  This means anything typed
#              at $mod+d can be executed.
#   "argv"  -- shlex tokenise and exec directly, no shell metacharacters.
#   "off"   -- no fallback; only .desktop entries can be launched.
command_fallback = "shell"

# Terminal used for Terminal=true entries and for the "shell" fallback.
# Empty means: $TERMINAL, then $TERMINAL_EMULATOR, then foot.
terminal = ""

# Extra directories of .desktop files, searched before the XDG ones.
desktop_file_dirs = []
